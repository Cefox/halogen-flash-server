name: Sync upstream

on:
  schedule:
    # Run every 20 minutes, slightly off the hour to avoid the busiest slot.
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out fork
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream/main
        env:
          UPSTREAM_REPOSITORY: peonist-ai/halogen-flash-server
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream main

          # A fork-only commit still contains the previous upstream tip, so an
          # ancestor check distinguishes "already current" from a real update.
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Fork already contains upstream/main; nothing to sync."
            exit 0
          fi

          echo "Upstream has new commits; attempting a merge."
          if ! git merge --no-edit upstream/main; then
            git merge --abort || true
            echo "::error title=Upstream sync conflict::upstream/main conflicts with a fork-only change. Resolve it manually; this workflow did not push anything."
            exit 1
          fi

          git push origin HEAD:main
